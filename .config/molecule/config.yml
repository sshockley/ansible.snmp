---
# Base Molecule config for every scenario: Docker with systemd-enabled images.
# Pick the image with MOLECULE_DISTRO (e.g. rockylinux9, debian12, ubuntu2404).
# For Podman use: molecule -c .config/molecule/podman.yml test
driver:
  name: docker
platforms:
  - name: snmp-${MOLECULE_SCENARIO_NAME}-${MOLECULE_DISTRO:-rockylinux9}
    image: docker.io/geerlingguy/docker-${MOLECULE_DISTRO:-rockylinux9}-ansible:latest
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
