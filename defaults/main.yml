---
# defaults file for sshockley.snmp

snmp_additional_packages: []
snmp_encryption: snmp_encryption
snmp_extension_scripts: '/usr/local/lib/snmpd'
snmp_permitted_managers: []
snmp_password: snmp_password
snmp_user: snmp
snmp_agentx_enabled: false

snmp_librenms_repo: 'https://github.com/sshockley/librenms-agent/raw/refs/heads/master'

snmp_agentaddress_protocol:
  ipv4: udp
  ipv6: udp6
snmp_agentaddress_address:
  ipv4: "{{ ansible_facts['default_ipv4']['address'] | default('') }}"
  ipv6: "{{ ansible_facts['default_ipv6']['address'] | default('') }}"
snmp_agentaddress_port:
  ipv4: 161
  ipv6: 161

snmp_extension_list: []
#   - url: 'https://raw.githubusercontent.com/sshockley/librenms-agent/master/snmp/distro'
#     extend: '.1.3.6.1.4.1.2021.7890.1 distro {{ snmp_extension_scripts }}/distro'

snmp_include_smart: false

# cron schedules (minute hour day month weekday) for the LibreNMS extension jobs
snmp_cron_osupdates: '0 * * * *'
snmp_cron_systemd: '0 * * * *'
snmp_cron_smart: '0 * * * *'
