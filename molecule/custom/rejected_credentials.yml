---
# Run the role with verify_case's credentials; it must stop at the credential check.
- name: "Run the role with {{ verify_case.name }}"
  block:
    - name: "Include the role with {{ verify_case.name }}"
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        snmp_password: "{{ verify_case.password }}"
        snmp_encryption: "{{ verify_case.encryption | string }}"

    - name: "Fail because the role accepted {{ verify_case.name }}"
      ansible.builtin.fail:
        msg: "The role accepted credentials with {{ verify_case.name }}"
  rescue:
    - name: "Check the credential check rejected {{ verify_case.name }}"
      ansible.builtin.assert:
        that: ansible_failed_task.name == 'Verify SNMPv3 credentials are set'
        fail_msg: "{{ ansible_failed_task.name }}: {{ ansible_failed_result.msg | default('') }}"
