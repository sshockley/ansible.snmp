---
# Non-default settings (custom user, loopback-only bind on a custom port,
# AgentX) and rejection of unsafe SNMPv3 credentials.
provisioner:
  name: ansible
  playbooks:
    prepare: ../default/prepare.yml
    converge: ../default/converge.yml
  inventory:
    group_vars:
      all:
        # Molecule connects as root; sudo fails PAM checks EL
        ansible_become: false
        snmp_user: monitor
        snmp_password: custom-auth-pass
        snmp_encryption: custom-priv-pass
        snmp_location: Custom Rack 7
        # Empty, so sysContact must be left out
        snmp_contact: ""
        # Partial override: ipv6 is left out on purpose
        snmp_agentaddress_address:
          ipv4: 127.0.0.1
        snmp_agentaddress_port:
          ipv4: 1161
          ipv6: 1161
        snmp_agentx_enabled: true
verifier:
  name: ansible
