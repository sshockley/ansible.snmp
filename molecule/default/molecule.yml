---
# Full Linux run: install, LibreNMS extensions, cleanup of stale extensions,
# idempotence, and end-to-end SNMPv3 queries.
# Pick the image with MOLECULE_DISTRO (e.g. rockylinux9, debian12, ubuntu2404).
driver:
  name: docker
platforms:
  - name: snmp-${MOLECULE_DISTRO:-rockylinux9}
    image: geerlingguy/docker-${MOLECULE_DISTRO:-rockylinux9}-ansible:latest
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        # Molecule connects as root; sudo fails PAM checks in EL
        ansible_become: false
        snmp_user: snmp
        snmp_password: molecule-auth-pass
        snmp_encryption: molecule-priv-pass
        snmp_location: Molecule Lab
        snmp_contact: molecule@example.com
        snmp_extension_list:
          - url: file:///opt/molecule/hello.sh
            extend: hello /usr/local/lib/snmpd/hello.sh
verifier:
  name: ansible
