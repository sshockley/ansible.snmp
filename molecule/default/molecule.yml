---
# Full Linux run: install, LibreNMS extensions, cleanup of stale extensions,
# idempotence, and end-to-end SNMPv3 queries.
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        # Molecule connects as root; sudo fails PAM checks in EL
        ansible_become: false
        snmp_user: snmp
        snmp_password: molecule-auth-pass
        snmp_encryption: molecule-priv-pass
        snmp_location: Molecule Lab
        snmp_contact: molecule@example.com
        snmp_extension_list:
          - url: file:///opt/molecule/hello.sh
            extend: hello /usr/local/lib/snmpd/hello.sh
verifier:
  name: ansible
