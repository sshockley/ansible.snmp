---
# tasks file for sshockley.snmp

- name: 'Verify SNMPv3 credentials are set'
  ansible.builtin.assert:
    that:
      - snmp_password != 'snmp_password'
      - snmp_encryption != 'snmp_encryption'
      - snmp_password | length >= 8
      - snmp_encryption | length >= 8
      - snmp_password is match(snmp_safe_chars)
      - snmp_encryption is match(snmp_safe_chars)
    fail_msg: >-
      Set snmp_password and snmp_encryption (minimum 8 characters,
      not the placeholder defaults, printable ASCII only, no whitespace,
      quotes, '#' or backslashes) before running this role.
  vars:
    snmp_safe_chars: '^[A-Za-z0-9!$%&()*+,\-./:;<=>?@\[\]^_`{|}~]+$'
  when: ansible_system == "Linux"
  tags:
    - configuration
    - packages

- name: 'Verify SNMP community is set'
  ansible.builtin.assert:
    that:
      - snmp_community is defined
      - snmp_community | length > 0
    fail_msg: Set snmp_community before running this role on Windows.
  when: ansible_os_family == "Windows"
  tags:
    - configuration
    - packages

# NOTE: the "{{ ansible_distribution[:19] }}.yml" entry below truncates
# e.g. "Microsoft Windows 10 Pro" / "Microsoft Windows 11 Enterprise" to
# "Microsoft Windows 1" so Windows client editions match the
# "Microsoft Windows 1.yml" vars/tasks files. Do not rename those files.
- name: 'Load OS specific variables and tasks'
  vars:
    snmp_os_files:
      - "{{ ansible_distribution }}-{{ ansible_distribution_version }}.yml"
      - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
      - "{{ ansible_distribution }}.yml"
      - "{{ ansible_distribution[:19] }}.yml"
      - "{{ ansible_os_family }}.yml"
      - "{{ ansible_system }}.yml"
      - "defaults.yml"
  tags:
    - configuration
    - packages
  block:
    - name: 'Add OS specific variables'
      ansible.builtin.include_vars:
        file: "{{ lookup('ansible.builtin.first_found', files=snmp_os_files, paths=['vars']) }}"

    - name: 'Include distribution tasks'
      ansible.builtin.include_tasks:
        file: "{{ lookup('ansible.builtin.first_found', files=snmp_os_files, paths=['distribution']) }}"
