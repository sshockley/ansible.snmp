---
# tasks file for sbaerlocher.snmp

- name: "Linux : Install snmp"
  become: true
  tags:
    - packages
  ansible.builtin.package:
    name: "{{ snmp_packages + snmp_additional_packages }}"

- name: "Linux : Create snmpd include directory"
  become: true
  tags:
    - configuration
  ansible.builtin.file:
    path: '{{ snmp_confdir + "/snmpd.conf.d" }}'
    state: directory
    owner: root
    group: root
    mode: "0755"
    seuser: system_u
    serole: object_r
    setype: lib_t
    selevel: s0

- name: "Linux : Create snmp extension directory"
  become: true
  tags:
    - configuration
  ansible.builtin.file:
    path: "{{ snmp_extension_scripts }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
    seuser: system_u
    serole: object_r
    setype: lib_t
    selevel: s0

- name: "Linux : Install snmp extensions from snmp_extension_list"
  become: true
  tags:
    - configuration
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: '{{ snmp_extension_scripts + "/" }}'
    owner: root
    group: root
    mode: "0755"
    seuser: system_u
    serole: object_r
    setype: lib_t
    selevel: s0
  loop:
    - "{{ snmp_extension_list }}"

- name: "Linux : Install proxmox snmp extension"
  become: true
  tags:
    - configuration
  when: '"pve" in ansible_kernel'
  block:
    - name: "Linux : Download Proxmox extension"
      ansible.builtin.get_url:
        url: '{{ snmp_librenms_repo + "/agent-local/proxmox" }}'
        dest: '{{ snmp_extension_scripts + "/" }}'
        owner: root
        group: root
        mode: "0755"
        seuser: system_u
        serole: object_r
        setype: lib_t
        selevel: s0
    - name: "Linux : install proxmox snmpd config"
      ansible.builtin.template:
        src: "snmp/snmpd.conf.d/proxmox.conf.j2"
        dest: "{{ snmp_confdir }}/snmpd.conf.d/proxmox.conf"
        owner: root
        group: root
        mode: "0600"
        seuser: system_u
        serole: object_r
        setype: etc_t
        selevel: s0

- name: "Linux : install linux_config_files snmp extension"
  become: true
  tags:
    - configuration
  when: ansible_facts['os_family'] == "RedHat"
  block:
    - name: "Linux : Install EPEL repository"
      become: true
      tags:
        - packages
      ansible.builtin.package:
        name: epel-release
    - name: "Linux : Install linux_config_files script dependencies"
      become: true
      tags:
        - packages
      ansible.builtin.package:
        name: "{{ linux_config_files_packages }}"
    - name: "Download linux_config_files snmp extension"
      ansible.builtin.get_url:
        url: '{{ snmp_librenms_repo + "/snmp/linux_config_files.py" }}'
        dest: '{{ snmp_extension_scripts + "/" }}'
        owner: root
        group: root
        mode: "0755"
        seuser: system_u
        serole: object_r
        setype: lib_t
        selevel: s0
    - name: "Linux : install linux_config_files snmpd config"
      ansible.builtin.template:
        src: "snmp/snmpd.conf.d/linux_config_files.conf.j2"
        dest: "{{ snmp_confdir }}/snmpd.conf.d/linux_config_files.conf"
        owner: root
        group: root
        mode: "0600"
        seuser: system_u
        serole: object_r
        setype: etc_t
        selevel: s0

- name: "Linux : install systemd snmp extension"
  become: true
  tags:
    - configuration
  when: ansible_facts.service_mgr == "systemd"
  block:
    - name: "Download systemd snmp extension"
      ansible.builtin.get_url:
        url: '{{ snmp_librenms_repo + "/snmp/unpriv/systemd/systemd.py" }}'
        dest: '{{ snmp_extension_scripts + "/" }}'
        owner: root
        group: root
        mode: "0755"
        seuser: system_u
        serole: object_r
        setype: lib_t
        selevel: s0
    - name: "Linux : install systemd snmpd config"
      ansible.builtin.template:
        src: "snmp/snmpd.conf.d/systemd.conf.j2"
        dest: "{{ snmp_confdir }}/snmpd.conf.d/systemd.conf"
        owner: root
        group: root
        mode: "0600"
        seuser: system_u
        serole: object_r
        setype: etc_t
        selevel: s0
    - name: "Linux : install systemd crontab"
      ansible.builtin.template:
        src: "cron.d/99systemd-generate.j2"
        dest: "/etc/cron.d/99systemd-generate"
        owner: root
        group: root
        mode: "0644"
        seuser: system_u
        serole: object_r
        setype: system_cron_spool_t
        selevel: s0

- name: "Linux : install distro snmp extension"
  become: true
  tags:
    - configuration
  block:
    - name: "Download distro snmp extension"
      ansible.builtin.get_url:
        url: '{{ snmp_librenms_repo + "/snmp/distro" }}'
        dest: '{{ snmp_extension_scripts + "/" }}'
        owner: root
        group: root
        mode: "0755"
        seuser: system_u
        serole: object_r
        setype: lib_t
        selevel: s0
    - name: "Linux : install distro snmpd config"
      ansible.builtin.template:
        src: "snmp/snmpd.conf.d/distro.conf.j2"
        dest: "{{ snmp_confdir }}/snmpd.conf.d/distro.conf"
        owner: root
        group: root
        mode: "0600"
        seuser: system_u
        serole: object_r
        setype: etc_t
        selevel: s0

- name: Gather the package facts
  ansible.builtin.package_facts:
    manager: auto

- name: "Linux : install zfs snmp extension"
  become: true
  tags:
    - configuration
  when: "'zfs' in ansible_facts.packages or 'zfs-zed' in ansible_facts.packages"
  block:
    - name: "Download zfs snmp extension"
      ansible.builtin.get_url:
        url: '{{ snmp_librenms_repo + "/snmp/zfs" }}'
        dest: '{{ snmp_extension_scripts + "/" }}'
        owner: root
        group: root
        mode: "0755"
        seuser: system_u
        serole: object_r
        setype: lib_t
        selevel: s0
    - name: "Linux : install zfs snmpd config"
      ansible.builtin.template:
        src: "snmp/snmpd.conf.d/zfs.conf.j2"
        dest: "{{ snmp_confdir }}/snmpd.conf.d/zfs.conf"
        owner: root
        group: root
        mode: "0600"
        seuser: system_u
        serole: object_r
        setype: etc_t
        selevel: s0
    - name: "Linux : Install zfs script dependencies"
      become: true
      tags:
        - packages
      ansible.builtin.package:
        name: "{{ zfs_packages }}"
      when: zfs_packages | length > 0
    - name: "Linux - Configure SELinux"
      when: ansible_facts['os_family'] == "RedHat"
      block:
        - name: "Linux : Create SELinux configuration file"
          ansible.builtin.get_url:
            url: '{{ snmp_librenms_repo + "/snmp/snmp_nfs_zfs.te" }}'
            dest: '{{ snmp_confdir + "/" }}'
            owner: root
            group: root
            mode: "0755"
            seuser: system_u
            serole: object_r
            setype: etc_t
            selevel: s0
        - name: "Linux - Configure SELinux checkmodule"
          ansible.builtin.command: 'checkmodule -M -m -o {{ snmp_confdir }}/snmp_nfs_zfs.mod {{ snmp_confdir }}/snmp_nfs_zfs.te'
          args:
            creates: '{{ snmp_confdir }}/snmp_nfs_zfs.mod'
        - name: "Linux - Configure SELinux package"
          ansible.builtin.command: 'semodule_package -m {{ snmp_confdir }}/snmp_nfs_zfs.mod -o {{ snmp_confdir }}/snmp_nfs_zfs.pp'
          args:
            creates: '{{ snmp_confdir }}/snmp_nfs_zfs.pp'
          register: snmp_selinux_pp
        - name: "Linux - Configure SELinux package install"
          ansible.builtin.command: 'semodule -i {{ snmp_confdir }}/snmp_nfs_zfs.pp'
          when: snmp_selinux_pp is changed
#        - name: "Linux - Configure SELinux checkmodule" # noqa: command-instead-of-shell no-changed-when
#          ansible.builtin.shell: '/usr/bin/env checkmodule -M -m -o {{ snmp_confdir }}/snmp_nfs_zfs.mod {{ snmp_confdir }}/snmp_nfs_zfs.te'
#        - name: "Linux - Configure SELinux package" # noqa: command-instead-of-shell no-changed-when
#          ansible.builtin.shell: '/usr/bin/env semodule_package -m {{ snmp_confdir }}/snmp_nfs_zfs.mod -o {{ snmp_confdir }}/snmp_nfs_zfs.pp'
#        - name: "Linux - Configure SELinux package install" # noqa: command-instead-of-shell no-changed-when
#          ansible.builtin.shell: '/usr/bin/env semodule -i {{ snmp_confdir }}/snmp_nfs_zfs.pp'

- name: "Linux : install osupdates unprivileged snmp extension "
  become: true
  tags:
    - configuration
  block:
    - name: "Download osupdates-unpriv-generate.sh"
      ansible.builtin.get_url:
        url: '{{ snmp_librenms_repo + "/snmp/unpriv/osupdates/osupdates-unpriv-generate.sh" }}'
        dest: '{{ snmp_extension_scripts + "/" }}'
        owner: root
        group: root
        mode: "0755"
        seuser: system_u
        serole: object_r
        setype: lib_t
        selevel: s0
    - name: "Linux : install osupdates crontab"
      ansible.builtin.template:
        src: "cron.d/99osupdates-generate.j2"
        dest: "/etc/cron.d/99osupdates-generate"
        owner: root
        group: root
        mode: "0644"
        seuser: system_u
        serole: object_r
        setype: system_cron_spool_t
        selevel: s0
    - name: "Linux : install osupdates snmpd config"
      ansible.builtin.template:
        src: "snmp/snmpd.conf.d/osupdates.conf.j2"
        dest: "{{ snmp_confdir }}/snmpd.conf.d/osupdates.conf"
        owner: root
        group: root
        mode: "0600"
        seuser: system_u
        serole: object_r
        setype: etc_t
        selevel: s0

- name: "Linux : Install smartmontools"
  become: true
  tags:
    - packages
  when:
    - ansible_facts['virtualization_role'] != "guest"
    - not snmp_exclude_smart
    - smartmontools_packages | length > 0
  ansible.builtin.package:
    name: "{{ smartmontools_packages }}"

- name: "Linux : install smart-v1 snmp extension "
  become: true
  tags:
    - configuration
  when:
    - ansible_facts['virtualization_role'] != "guest"
    - not snmp_exclude_smart
    - smartmontools_packages | length > 0
  block:
    - name: "Download smart-v1"
      ansible.builtin.get_url:
        url: '{{ snmp_librenms_repo + "/snmp/smart-v1" }}'
        dest: '{{ snmp_extension_scripts + "/" }}'
        owner: root
        group: root
        mode: "0755"
        seuser: system_u
        serole: object_r
        setype: lib_t
        selevel: s0
    - name: "Linux : install smart-v1 crontab"
      ansible.builtin.template:
        src: "cron.d/99smart-v1.j2"
        dest: "/etc/cron.d/99smart-v1"
        owner: root
        group: root
        mode: "0644"
        seuser: system_u
        serole: object_r
        setype: system_cron_spool_t
        selevel: s0
    - name: "Linux : install smart-v1 snmpd config"
      ansible.builtin.template:
        src: "snmp/snmpd.conf.d/smart-v1.conf.j2"
        dest: "{{ snmp_confdir }}/snmpd.conf.d/smart-v1.conf"
        owner: root
        group: root
        mode: "0600"
        seuser: system_u
        serole: object_r
        setype: etc_t
        selevel: s0
    - name: "Linux : configure selinux for smart-v1 cache file"
      when: ansible_facts['os_family'] == "RedHat"
      community.general.sefcontext:
        target: '/var/cache/smart'
        setype: snmpd_var_lib_t
        state: present
    - name: "Linux - Generate smart-v1 config file" # noqa: command-instead-of-shell no-changed-when
      ansible.builtin.shell: '{{ snmp_extension_scripts + "/smart-v1 -g -C > " + snmp_extension_scripts + "/smart-v1.config" }}'
      args:
        creates: '{{ snmp_extension_scripts + "/smart-v1.config" }}'
    - name: "Linux : Fix snmp_persistent_directory"
      when: ansible_facts['os_family'] == "RedHat"
      become: true
      ansible.builtin.replace:
        path: '{{ snmp_extension_scripts + "/smart-v1.config" }}'
        regexp: "my $cache    = '/var/cache/smart';"
        replace: '{{ "my $cache    = ''" + snmp_persistent_directory + "/smart'';" }}'

- name: "Linux : configure snmpd daemon"
  become: true
  ansible.builtin.template:
    src: "default/snmpd.{{ ansible_os_family }}.j2"
    dest: "{{ snmp_daemon_config }}"
    owner: root
    group: root
    mode: "0644"
    seuser: system_u
    serole: object_r
    setype: etc_t
    selevel: s0
  notify:
    - Restart snmp

- name: "Linux : check create snmp config"
  become: true
  tags:
    - configuration
  ansible.builtin.template:
    src: "snmp/snmpd.conf.j2"
    dest: "{{ snmp_config }}"
    owner: root
    group: root
    mode: "0600"
    seuser: system_u
    serole: object_r
    setype: etc_t
    selevel: s0
  register: check_snmp
  check_mode: true

- name: "Linux : Configure snmp"
  when: check_snmp is changed
  tags:
    - configuration
  block:
    - name: "Linux : stopped snmp"
      become: true
      ansible.builtin.service:
        name: "{{ snmp_service_name }}"
        state: stopped

    - name: "Linux : Create snmp config"
      become: true
      ansible.builtin.template:
        src: "snmp/snmpd.conf.j2"
        dest: "{{ snmp_config }}"
        owner: root
        group: root
        mode: "0600"
        seuser: system_u
        serole: object_r
        setype: etc_t
        selevel: s0
      notify:
        - Restart snmp
    - name: "Linux : install snmpd extensions config"
      ansible.builtin.template:
        src: "snmp/snmpd.conf.d/extensions.conf.j2"
        dest: "{{ snmp_confdir }}/snmpd.conf.d/extensions.conf"
        owner: root
        group: root
        mode: "0600"
        seuser: system_u
        serole: object_r
        setype: etc_t
        selevel: s0
  always:
    # Ensure snmpd is running even if a task above failed
    - name: "Linux : Started snmp"
      become: true
      ansible.builtin.service:
        name: "{{ snmp_service_name }}"
        state: started

- name: "Linux : Enable snmp service"
  become: true
  tags:
    - configuration
  ansible.builtin.service:
    name: "{{ snmp_service_name }}"
    enabled: true
