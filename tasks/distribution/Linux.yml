---
# tasks file for sshockley.snmp

- name: "Linux : Install snmp"
  become: true
  tags:
    - packages
  ansible.builtin.package:
    name: "{{ snmp_packages + snmp_additional_packages }}"

- name: "Linux : Gather the package facts"
  tags:
    - always
  ansible.builtin.package_facts:
    manager: auto

- name: "Linux : Determine which LibreNMS extensions apply"
  tags:
    - always
  ansible.builtin.set_fact:
    snmp_extension_enabled: >-
      {{ dict(snmp_librenms_extensions | map(attribute='name')
              | zip(snmp_librenms_extensions | map(attribute='active') | map('bool'))) }}

- name: "Linux : Create snmpd include directory"
  become: true
  tags:
    - configuration
  ansible.builtin.file:
    path: '{{ snmp_confdir + "/snmpd.conf.d" }}'
    state: directory
    owner: root
    group: root
    mode: "0755"
    seuser: system_u
    serole: object_r
    setype: lib_t
    selevel: s0

- name: "Linux : Create snmp extension directory"
  become: true
  tags:
    - configuration
  ansible.builtin.file:
    path: "{{ snmp_extension_scripts }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
    seuser: system_u
    serole: object_r
    setype: lib_t
    selevel: s0

- name: "Linux : Install snmp extensions from snmp_extension_list"
  become: true
  tags:
    - configuration
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: '{{ snmp_extension_scripts + "/" }}'
    owner: root
    group: root
    mode: "0755"
    seuser: system_u
    serole: object_r
    setype: lib_t
    selevel: s0
  loop: "{{ snmp_extension_list }}"
  loop_control:
    label: "{{ item.url }}"

# The manifest records the scripts installed from snmp_extension_list, so ones
# dropped from the list can be removed without touching other files.
- name: "Linux : Remove scripts dropped from snmp_extension_list"
  become: true
  tags:
    - configuration
  vars:
    snmp_extension_manifest: "{{ snmp_extension_scripts }}/.snmp_extension_list.json"
    snmp_extension_names: >-
      {{ snmp_extension_list | map(attribute='url') | map('urlsplit', 'path') | map('basename') | list }}
  block:
    - name: "Linux : Read the snmp_extension_list manifest"
      ansible.builtin.slurp:
        src: "{{ snmp_extension_manifest }}"
      register: snmp_extension_manifest_raw
      failed_when: false

    - name: "Linux : Remove scripts no longer in snmp_extension_list"
      ansible.builtin.file:
        path: "{{ snmp_extension_scripts }}/{{ item }}"
        state: absent
      # LibreNMS scripts are installed and removed by the tasks below
      loop: >-
        {{ (snmp_extension_manifest_raw.content | default('W10=') | b64decode | from_json)
           | difference(snmp_extension_names)
           | difference(snmp_librenms_extensions | map(attribute='url') | map('basename')) }}

    - name: "Linux : Write the snmp_extension_list manifest"
      ansible.builtin.copy:
        content: "{{ snmp_extension_names | to_json }}"
        dest: "{{ snmp_extension_manifest }}"
        owner: root
        group: root
        mode: "0644"
        seuser: system_u
        serole: object_r
        setype: lib_t
        selevel: s0

- name: "Linux : Proxmox extension prerequisites"
  become: true
  tags:
    - configuration
  when:
    - snmp_extension_enabled['proxmox']
    - snmp_daemon_user is defined
  block:
    - name: "Linux : Install sudo for proxmox extension"
      tags:
        - packages
      ansible.builtin.package:
        name: sudo
    - name: "Linux : Allow snmpd to run proxmox extension as root"
      ansible.builtin.template:
        src: sudoers.d/snmpd-proxmox.j2
        dest: /etc/sudoers.d/snmpd-proxmox
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"

- name: "Linux : linux_config_files extension prerequisites"
  become: true
  tags:
    - packages
  when: snmp_extension_enabled['linux_config_files']
  block:
    - name: "Linux : Install EPEL repository"
      when: ansible_facts['distribution'] != 'Fedora'
      ansible.builtin.package:
        name: epel-release
    - name: "Linux : Install linux_config_files script dependencies"
      ansible.builtin.package:
        name: "{{ snmp_linux_config_files_packages }}"

- name: "Linux : ZFS extension prerequisites"
  become: true
  tags:
    - configuration
  when: snmp_extension_enabled['zfs']
  block:
    - name: "Linux : Install ZFS script dependencies"
      tags:
        - packages
      ansible.builtin.package:
        name: "{{ snmp_zfs_packages }}"
      when: snmp_zfs_packages | length > 0
    - name: "Linux : Configure SELinux"
      when:
        - ansible_facts['os_family'] == "RedHat"
        - ansible_facts['selinux']['status'] | default('disabled') == "enabled"
      block:
        - name: "Linux : Install SELinux policy build tools"
          tags:
            - packages
          ansible.builtin.package:
            name:
              - checkpolicy
              - policycoreutils
        - name: "Linux : Create SELinux policy source directory"
          ansible.builtin.file:
            path: "{{ snmp_selinux_source_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0755"
        # Kept so a changed policy upstream triggers a rebuild
        - name: "Linux : Download SELinux policy source"
          ansible.builtin.get_url:
            url: '{{ snmp_librenms_repo + "/snmp/snmp_nfs_zfs.te" }}'
            dest: "{{ snmp_selinux_source_dir }}/snmp_nfs_zfs.te"
            owner: root
            group: root
            mode: "0644"
          register: snmp_selinux_te
        - name: "Linux : List installed SELinux modules"
          ansible.builtin.command:
            argv: [semodule, -l]
          register: snmp_selinux_modules
          changed_when: false
          check_mode: false
        - name: "Linux : Build and install SELinux module"
          when: >-
            snmp_selinux_te is changed
            or 'snmp_nfs_zfs' not in (snmp_selinux_modules.stdout_lines | select | map('split') | map('first'))
          block:
            - name: "Linux : Create SELinux module build directory"
              ansible.builtin.tempfile:
                state: directory
                suffix: .snmp_selinux
              register: snmp_selinux_build
            - name: "Linux : Compile SELinux module"
              ansible.builtin.command:
                argv:
                  - checkmodule
                  - -M
                  - -m
                  - -o
                  - "{{ snmp_selinux_build.path }}/snmp_nfs_zfs.mod"
                  - "{{ snmp_selinux_source_dir }}/snmp_nfs_zfs.te"
              changed_when: true
            - name: "Linux : Package SELinux module"
              ansible.builtin.command:
                argv:
                  - semodule_package
                  - -m
                  - "{{ snmp_selinux_build.path }}/snmp_nfs_zfs.mod"
                  - -o
                  - "{{ snmp_selinux_build.path }}/snmp_nfs_zfs.pp"
              changed_when: true
            - name: "Linux : Install SELinux module"
              ansible.builtin.command:
                argv: [semodule, -i, "{{ snmp_selinux_build.path }}/snmp_nfs_zfs.pp"]
              changed_when: true
          always:
            - name: "Linux : Remove SELinux module build directory"
              when: snmp_selinux_build.path is defined
              ansible.builtin.file:
                path: "{{ snmp_selinux_build.path }}"
                state: absent

# Earlier versions of the role built the module in snmp_confdir
- name: "Linux : Remove SELinux build files from snmp_confdir"
  become: true
  tags:
    - configuration
  ansible.builtin.file:
    path: "{{ snmp_confdir }}/{{ item }}"
    state: absent
  loop:
    - snmp_nfs_zfs.te
    - snmp_nfs_zfs.mod
    - snmp_nfs_zfs.pp

- name: "Linux : Install smartmontools"
  become: true
  tags:
    - packages
  when: snmp_extension_enabled['smart-v1']
  ansible.builtin.package:
    name: "{{ snmp_smartmontools_packages }}"

# Install the extensions that apply to this host
- name: "Linux : Download LibreNMS extension scripts"
  become: true
  tags:
    - configuration
  when: snmp_extension_enabled[item.name]
  ansible.builtin.get_url:
    url: "{{ snmp_librenms_repo }}/{{ item.url }}"
    dest: '{{ snmp_extension_scripts + "/" }}'
    owner: root
    group: root
    mode: "0755"
    seuser: system_u
    serole: object_r
    setype: lib_t
    selevel: s0
  loop: "{{ snmp_librenms_extensions }}"
  loop_control:
    label: "{{ item.name }}"

- name: "Linux : Install LibreNMS extension snmpd configs"
  become: true
  tags:
    - configuration
  when: snmp_extension_enabled[item.name]
  ansible.builtin.template:
    src: "snmp/snmpd.conf.d/{{ item.name }}.conf.j2"
    dest: "{{ snmp_confdir }}/snmpd.conf.d/{{ item.name }}.conf"
    owner: root
    group: root
    mode: "0600"
    seuser: system_u
    serole: object_r
    setype: etc_t
    selevel: s0
  loop: "{{ snmp_librenms_extensions }}"
  loop_control:
    label: "{{ item.name }}"
  notify:
    - Restart snmp

- name: "Linux : Install LibreNMS extension cron jobs"
  become: true
  tags:
    - configuration
  when:
    - snmp_extension_enabled[item.name]
    - item.cron is defined
  ansible.builtin.template:
    src: "cron.d/{{ item.cron }}.j2"
    dest: "/etc/cron.d/{{ item.cron }}"
    owner: root
    group: root
    mode: "0644"
    seuser: system_u
    serole: object_r
    setype: system_cron_spool_t
    selevel: s0
  loop: "{{ snmp_librenms_extensions }}"
  loop_control:
    label: "{{ item.name }}"

- name: "Linux : Configure smart-v1 extension"
  become: true
  tags:
    - configuration
  when: snmp_extension_enabled['smart-v1']
  block:
    - name: "Linux : Configure selinux for smart-v1 cache file"
      when:
        - ansible_facts['os_family'] == "RedHat"
        - ansible_facts['selinux']['status'] | default('disabled') == "enabled"
      community.general.sefcontext:
        target: '/var/cache/smart'
        setype: snmpd_var_lib_t
        state: present
    - name: "Linux : Generate smart-v1 config file" # noqa: command-instead-of-shell no-changed-when
      ansible.builtin.shell: >-
        {{ snmp_extension_scripts }}/smart-v1 -g -C > {{ snmp_extension_scripts }}/smart-v1.config.tmp
        && mv {{ snmp_extension_scripts }}/smart-v1.config.tmp {{ snmp_extension_scripts }}/smart-v1.config
        || { rm -f {{ snmp_extension_scripts }}/smart-v1.config.tmp; exit 1; }
      args:
        creates: '{{ snmp_extension_scripts + "/smart-v1.config" }}'
    - name: "Linux : Fix snmp_persistent_directory"
      when: ansible_facts['os_family'] == "RedHat"
      ansible.builtin.lineinfile:
        path: '{{ snmp_extension_scripts + "/smart-v1.config" }}'
        regexp: '^#?cache='
        line: '{{ "cache=" + snmp_persistent_directory + "/smart" }}'

# Remove extensions that no longer apply to this host
- name: "Linux : Remove inactive LibreNMS extension snmpd configs"
  become: true
  tags:
    - configuration
  when: not snmp_extension_enabled[item.name]
  ansible.builtin.file:
    path: "{{ snmp_confdir }}/snmpd.conf.d/{{ item.name }}.conf"
    state: absent
  loop: "{{ snmp_librenms_extensions }}"
  loop_control:
    label: "{{ item.name }}"
  notify:
    - Restart snmp

- name: "Linux : Remove inactive LibreNMS extension scripts"
  become: true
  tags:
    - configuration
  when: not snmp_extension_enabled[item.name]
  ansible.builtin.file:
    path: "{{ snmp_extension_scripts }}/{{ item.url | basename }}"
    state: absent
  loop: "{{ snmp_librenms_extensions }}"
  loop_control:
    label: "{{ item.name }}"

- name: "Linux : Remove inactive LibreNMS extension cron jobs"
  become: true
  tags:
    - configuration
  when:
    - not snmp_extension_enabled[item.name]
    - item.cron is defined
  ansible.builtin.file:
    path: "/etc/cron.d/{{ item.cron }}"
    state: absent
  loop: "{{ snmp_librenms_extensions }}"
  loop_control:
    label: "{{ item.name }}"

- name: "Linux : Remove inactive LibreNMS extension leftovers"
  become: true
  tags:
    - configuration
  when: not snmp_extension_enabled[item.0.name]
  ansible.builtin.file:
    path: "{{ item.1 }}"
    state: absent
  loop: "{{ snmp_librenms_extensions | subelements('cleanup', skip_missing=True) }}"
  loop_control:
    label: "{{ item.1 }}"

- name: "Linux : Remove selinux context for smart-v1 cache file"
  become: true
  tags:
    - configuration
  when:
    - not snmp_extension_enabled['smart-v1']
    - ansible_facts['os_family'] == "RedHat"
    - ansible_facts['selinux']['status'] | default('disabled') == "enabled"
  community.general.sefcontext:
    target: '/var/cache/smart'
    setype: snmpd_var_lib_t
    state: absent

- name: "Linux : Configure snmpd daemon"
  become: true
  tags:
    - configuration
  ansible.builtin.template:
    src: "default/snmpd.{{ ansible_facts['os_family'] }}.j2"
    dest: "{{ snmp_daemon_config }}"
    owner: root
    group: root
    mode: "0644"
    seuser: system_u
    serole: object_r
    setype: etc_t
    selevel: s0
  notify:
    - Restart snmp

- name: "Linux : Make the snmpd unit use the daemon options file"
  become: true
  when: ansible_facts['os_family'] == 'Debian'
  tags:
    - configuration
  block:
    - name: "Linux : Create the snmpd unit drop-in directory"
      ansible.builtin.file:
        path: /etc/systemd/system/snmpd.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: "Linux : Install the snmpd unit drop-in"
      ansible.builtin.template:
        src: systemd/snmpd.service.d/options.conf.j2
        dest: /etc/systemd/system/snmpd.service.d/options.conf
        owner: root
        group: root
        mode: "0644"
      register: snmp_unit_dropin
      notify:
        - Restart snmp

    - name: "Linux : Reload systemd after changing the snmpd unit drop-in"
      when: snmp_unit_dropin is changed
      ansible.builtin.systemd_service:
        daemon_reload: true

- name: "Linux : Install snmpd extensions config"
  become: true
  tags:
    - configuration
  ansible.builtin.template:
    src: "snmp/snmpd.conf.d/extensions.conf.j2"
    dest: "{{ snmp_confdir }}/snmpd.conf.d/extensions.conf"
    owner: root
    group: root
    mode: "0600"
    seuser: system_u
    serole: object_r
    setype: etc_t
    selevel: s0
  notify:
    - Restart snmp

- name: "Linux : Check create snmp config"
  become: true
  tags:
    - configuration
  ansible.builtin.template:
    src: "snmp/snmpd.conf.j2"
    dest: "{{ snmp_config }}"
    owner: root
    group: root
    mode: "0600"
    seuser: system_u
    serole: object_r
    setype: etc_t
    selevel: s0
  register: snmp_config_check
  check_mode: true
  diff: false  # contains passwords

- name: "Linux : Configure snmp"
  when: snmp_config_check is changed
  tags:
    - configuration
  block:
    - name: "Linux : Stopped snmp"
      become: true
      ansible.builtin.service:
        name: "{{ snmp_service_name }}"
        state: stopped

    - name: "Linux : Remove saved SNMPv3 users"
      become: true
      ansible.builtin.lineinfile:
        path: "{{ snmp_persistent_directory }}/snmpd.conf"
        regexp: '^usmUser '
        state: absent

    - name: "Linux : Create snmp config"
      become: true
      ansible.builtin.template:
        src: "snmp/snmpd.conf.j2"
        dest: "{{ snmp_config }}"
        owner: root
        group: root
        mode: "0600"
        seuser: system_u
        serole: object_r
        setype: etc_t
        selevel: s0
      diff: false  # contains passwords
      notify:
        - Restart snmp
  always:
    # Ensure snmpd is running even if a task above failed
    - name: "Linux : Started snmp"
      become: true
      ansible.builtin.service:
        name: "{{ snmp_service_name }}"
        state: started

- name: "Linux : Enable snmp service"
  become: true
  tags:
    - configuration
  ansible.builtin.service:
    name: "{{ snmp_service_name }}"
    enabled: true
